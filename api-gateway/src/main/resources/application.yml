server:
  port: 3000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: project-management-service
          uri: http://${PROJECT_MANAGEMENT_HOST:localhost}:${PROJECT_MANAGEMENT_PORT:8080}
          predicates:
            - Path=/api/**,/swagger-ui/**,/api-docs/**
        - id: project-management-websocket
          uri: ws://${PROJECT_MANAGEMENT_HOST:localhost}:${PROJECT_MANAGEMENT_PORT:8080}
          predicates:
            - Path=/ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
            allowedHeaders: "*"
            allowCredentials: true

security:
  jwt:
    secret: ${JWT_SECRET:1234567890}
    cookie-name: jwt
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:project-management-gateway-secret}
    shared-header: X-Gateway-Auth

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.projectmanagement.gateway.filter.WebSocketAuthPreFilter: DEBUG
    reactor.netty: INFO
    org.springframework.web.socket: DEBUG

