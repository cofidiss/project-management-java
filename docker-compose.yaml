version: "3.9"

services:
  api-gateway:
    image: project-management-api-gateway:latest
    build:
      context: .
      dockerfile: api-gateway/dockerfile
    container_name: project-management-api-gateway
    depends_on:
      - project-management-app
    environment:
      PROJECT_MANAGEMENT_HOST: project-management-app
      PROJECT_MANAGEMENT_PORT: 8080
      GATEWAY_SHARED_SECRET: project-management-gateway-secret
    ports:
      - "3000:3000"

  project-management-app:
    image: project-management-spring:latest
    build:
      context: .
      dockerfile: dockerfile
    container_name: project-management-spring
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_SHARED_SECRET: project-management-gateway-secret


  postgres:
    image: postgres:17
    container_name: project-management-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ZAQ12wsx
      POSTGRES_DB: project_management
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
